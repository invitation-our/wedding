        /* ==================================================
           인트로
        ================================================== */

        .intro {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;

            z-index: 99999;

            background: #fdfaf5;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow: hidden;

            cursor: pointer;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-inner {
            position: relative;

            width: min(600px, 100vw);
            height: 100%;

            overflow: hidden;
        }

        .intro-01 {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 1;
        }

        .intro-layer {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0;

            transform: translateY(35px);

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;
        }

        .intro-layer.show {
            opacity: 1;
            transform: translateY(0);
        }

        .intro-02 {
            transition-delay: 0.15s;
        }

        .intro-03 {
            transition-delay: 0.35s;
        }

        .intro-04 {
            transition-delay: 0.55s;
        }

    <script>


        /* ==================================================
           인트로
        ================================================== */

        const intro =
            document.getElementById("intro");

        const envelopeOverlay =
            document.getElementById("envelope-overlay");

        const introLayers =
            document.querySelectorAll(".intro-layer");


        window.addEventListener(
            "load",
            () => {

                introLayers.forEach(
                    (layer, index) => {

                        setTimeout(
                            () => {

                                layer.classList.add("show");

                            },
                            300 + (index * 350)
                        );

                    }
                );

            }
        );


        intro.addEventListener(
            "click",
            () => {

                window.scrollTo(0, 0);

                intro.classList.add("hide");

                envelopeOverlay.classList.add("show");

                document.body.style.overflow = "";

            }
        );


        /* =====================================
           스크롤 등장 / 사라짐 애니메이션
        ===================================== */

        const scrollRevealElements =
            document.querySelectorAll(".scroll-reveal");


        /*
         * 지도 버튼 이미지와
         * 지하철 / 버스 / 자차 버튼 이미지는
         * 이미지 자체를 Observer에 넣지 않는다.
         *
         * 이미지가 아니라
         * 실제 버튼 영역을 감지해서
         * 이미지에 show를 붙인다.
         */

        const buttonRevealImages =
            document.querySelectorAll(
                ".location-button-image, .transport-button img"
            );


const normalScrollRevealElements =
    Array.from(
        scrollRevealElements
    ).filter(
        (element) => {

            return !element.matches(
                ".location-button-image"
            );

        }
    );


        /* 일반 이미지 */

        const scrollRevealObserver =
            new IntersectionObserver(
                (entries) => {

                    entries.forEach(
                        (entry) => {

                            if (
                                entry.isIntersecting
                            ) {

                                entry.target.classList.add(
                                    "show"
                                );

                            } else {

                                entry.target.classList.remove(
                                    "show"
                                );

                            }

                        }
                    );

                },
                {
                    threshold: 0.15,

                    rootMargin:
                        "0px 0px -50px 0px"
                }
            );


        normalScrollRevealElements.forEach(
            (element) => {

                scrollRevealObserver.observe(
                    element
                );

            }
        );


        /* =====================================
           지도 / 교통 버튼 전용 Observer
        ===================================== */

        const buttonRevealObserver =
            new IntersectionObserver(
                (entries) => {

                    entries.forEach(
                        (entry) => {

                            const image =
                                entry.target.querySelector(
                                    ".scroll-reveal"
                                );


                            if (!image) {
                                return;
                            }


                            if (
                                entry.isIntersecting
                            ) {

                                image.classList.add(
                                    "show"
                                );

                            } else {

                                image.classList.remove(
                                    "show"
                                );

                            }

                        }
                    );

                },
                {
                    threshold: 0.05,

                    rootMargin:
                        "0px 0px -30px 0px"
                }
            );


        /* =====================================
           지도 버튼 이미지
        ===================================== */

        const locationButtonWrap =
            document.querySelector(
                ".location-button-wrap"
            );


        if (
            locationButtonWrap
        ) {

            buttonRevealObserver.observe(
                locationButtonWrap
            );

        }




        /* ==================================================
           D-Day
        ================================================== */

        const weddingDate =
            new Date(
                "2026-11-21T12:40:00+09:00"
            );


        function updateCountdown() {

            const now =
                new Date();

            const difference =
                weddingDate - now;


            if (
                difference <= 0
            ) {

                document.getElementById(
                    "days"
                ).textContent = "00";

                document.getElementById(
                    "hours"
                ).textContent = "00";

                document.getElementById(
                    "minutes"
                ).textContent = "00";

                document.getElementById(
                    "seconds"
                ).textContent = "00";

                document.getElementById(
                    "dday"
                ).textContent = "0";

                return;
            }


            const totalSeconds =
                Math.floor(
                    difference / 1000
                );


            const days =
                Math.floor(
                    totalSeconds / 86400
                );


            const hours =
                Math.floor(
                    (totalSeconds % 86400) /
                    3600
                );


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) /
                    60
                );


            const seconds =
                totalSeconds % 60;


            document.getElementById(
                "days"
            ).textContent =
                String(days).padStart(
                    2,
                    "0"
                );


            document.getElementById(
                "hours"
            ).textContent =
                String(hours).padStart(
                    2,
                    "0"
                );


            document.getElementById(
                "minutes"
            ).textContent =
                String(minutes).padStart(
                    2,
                    "0"
                );


            document.getElementById(
                "seconds"
            ).textContent =
                String(seconds).padStart(
                    2,
                    "0"
                );


            document.getElementById(
                "dday"
            ).textContent =
                days;

        }


        updateCountdown();


        setInterval(
            updateCountdown,
            1000
        );


        /* ==================================================
           middle 순차 등장
        ================================================== */

        const middleSection =
            document.querySelector(
                ".middle-section"
            );

        const middleLayers =
            document.querySelectorAll(
                ".middle-layer"
            );


        function updateMiddleReveal() {

            const rect =
                middleSection.getBoundingClientRect();

            const windowHeight =
                window.innerHeight;


            const start =
                windowHeight;


            const end =
                -middleSection.offsetHeight * 0.6;


            let progress =
                (start - rect.top) /
                (start - end);


            progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        progress
                    )
                );


            const total =
                middleLayers.length;


            const stageProgress =
                progress * total;


            middleLayers.forEach(
                (layer, index) => {

                    let localProgress =
                        stageProgress - index;


                    localProgress =
                        Math.max(
                            0,
                            Math.min(
                                1,
                                localProgress
                            )
                        );


                    const eased =
                        localProgress *
                        localProgress *
                        (3 - 2 * localProgress);


                    layer.style.opacity =
                        eased;


                    layer.style.transform =
                        `translateY(${30 - (30 * eased)}px)`;

                }
            );

        }


        window.addEventListener(
            "scroll",
            updateMiddleReveal
        );

        window.addEventListener(
            "resize",
            updateMiddleReveal
        );


        updateMiddleReveal();


        /* ==================================================
           갤러리
        ================================================== */

        const galleryImages =

                ".gallery-item"
            );

                "galleryModalImage"

        const galleryClose =
            document.getElementById(
                "galleryClose"
            );

        const galleryPrev =
            document.getElementById(
                "galleryPrev"
            );

        const galleryNext =
            document.getElementById(
                "galleryNext"
            );


        let galleryIndex = 0;


        galleryImages.forEach(
            (image, index) => {

                image.addEventListener(
                    "click",
                    () => {

                        galleryIndex =
                            index;

                        galleryModalImage.src =
                            galleryImages[
                                galleryIndex
                            ].src;

                        galleryModal.classList.add(
                            "active"
                        );

                        document.body.style.overflow =
                            "hidden";

                    }
                );

            }
        );


        galleryClose.addEventListener(
            "click",
            () => {

                galleryModal.classList.remove(
                    "active"
                );

                document.body.style.overflow =
                    "";

            }
        );


        galleryPrev.addEventListener(
            "click",
            () => {

                galleryIndex--;


                if (
                    galleryIndex < 0
                ) {

                    galleryIndex =
                        galleryImages.length - 1;

                }


                galleryModalImage.src =
                    galleryImages[
                        galleryIndex
                    ].src;

            }
        );


        galleryNext.addEventListener(
            "click",
            () => {

                galleryIndex++;


                if (
                    galleryIndex >=
                    galleryImages.length
                ) {

                    galleryIndex = 0;

                }


                galleryModalImage.src =
                    galleryImages[
                        galleryIndex
                    ].src;

            }
        );


        galleryModal.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    galleryModal
                ) {

                    galleryModal.classList.remove(
                        "active"
                    );

                    document.body.style.overflow =

                }

            }
        );


        /* ==================================================
           약도 팝업
        ================================================== */

        const locationMapButton =
            document.getElementById(
                "locationMapButton"

        const locationMapModal =

                locationMapModal.classList.remove(

                    locationMapModal.classList.remove(

                    );

                    document.body.style.overflow =
                        "";

                }

            }
        );


        /* ==================================================
           교통 이용 안내
        ================================================== */

        const transportBoxes =
            document.querySelectorAll(
                ".transport-box"
            );


        transportBoxes.forEach(
            (box) => {

                const button =
                    box.querySelector(
                        ".transport-button"
                    );

                const info =
                    box.querySelector(
                        ".transport-info"
                    );


                button.addEventListener(
                    "click",
                    () => {

                        const isOpen =
                            box.classList.contains(
                                "open"
                            );


                        transportBoxes.forEach(
                            (otherBox) => {

                                otherBox.classList.remove(
                                    "open"
                                );

                            }
                        );


                        if (
                            !isOpen
                        ) {

                            box.classList.add(
                                "open"

                        }

                    }
                );


                info.addEventListener(
                    "click",
                    () => {

                        box.classList.remove(
                            "open"
                        );

                    }
                );

            }
        );


        /* ==================================================
           middle2 순차 등장
        ================================================== */

        const middle2Section =
            document.querySelector(
                ".middle2-section"
            );

        const middle2Layers =
            document.querySelectorAll(
                ".middle2-layer:not(.middle2-background)"
            );


        function updateMiddle2Reveal() {

            const rect =
                middle2Section.getBoundingClientRect();

            const windowHeight =
                window.innerHeight;


            const start =
                windowHeight * 0.65;


            const end =
                -middle2Section.offsetHeight * 0.3;


            let progress =
                (start - rect.top) /
                (start - end);


            progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        progress
                    )
                );


            const total =
                middle2Layers.length;


            const stageProgress =
                progress * total;


            middle2Layers.forEach(
                (layer, index) => {

                    let localProgress =
                        stageProgress - index;


                    localProgress =
                        Math.max(
                            0,
                            Math.min(
                                1,
                                localProgress
                            )
                        );


                    const eased =
                        localProgress *
                        localProgress *
                        (3 - 2 * localProgress);


                    layer.style.opacity =
                        eased;

                }
            );

        }


        window.addEventListener(
            "scroll",
            updateMiddle2Reveal
        );

        window.addEventListener(
            "resize",
            updateMiddle2Reveal
        );


        updateMiddle2Reveal();


        /* ==================================================
           방명록
        ================================================== */

        const guestbookListScreen =
            document.getElementById(
                "guestbook-list-screen"
            );

        const guestbookWrittenScreen =
            document.getElementById(
                "guestbook-written-screen"
            );

        const guestbookFormScreen =
            document.getElementById(
                "guestbook-form-screen"
            );

        const guestbookFormClose =
            document.getElementById(
                "guestbook-form-close"
            );

            document.querySelector(
                ".guestbook-write-button"
            );

            document.querySelector(
                ".guestbook-write-again-button"
            );

            document.getElementById(
                "guestbook-name"
            );

        const guestbookContent =
            document.getElementById(
                "guestbook-content"
            );

        const guestbookPassword =
            document.getElementById(
                "guestbook-password"
            );

        const guestbookEntryList =
            document.getElementById(
                "guestbook-entry-list"
            );


        function getGuestbookEntries() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "weddingGuestbook"
                    ) || "[]"
                );

            } catch (error) {

                return [];

            }

        }


        function openGuestbookForm() {

            guestbookFormScreen.classList.add(
                "show"
            );

            document.body.style.overflow =
                "hidden";

        }


        function closeGuestbookForm() {

            guestbookFormScreen.classList.remove(
                "show"
            );

            document.body.style.overflow =
                "";

        }


        function updateGuestbookScreen() {

            const entries =
                getGuestbookEntries();


            if (
                entries.length > 0
            ) {

                guestbookListScreen.style.display =
                    "none";

                guestbookWrittenScreen.style.display =
                    "block";

                renderGuestbookEntries();

            } else {

                guestbookListScreen.style.display =
                    "block";

                guestbookWrittenScreen.style.display =
                    "none";

                guestbookEntryList.innerHTML =
                    "";

            }

        }


        function renderGuestbookEntries() {

            const entries =
                getGuestbookEntries();


            guestbookEntryList.innerHTML =
                "";


            if (
                entries.length === 0
            ) {

                updateGuestbookScreen();

                return;

            }


            entries.forEach(
                (entry, index) => {

                    const entryElement =
                        document.createElement(
                            "div"
                        );

                    entryElement.className =
                        "guestbook-entry";


                    const header =
                        document.createElement(
                            "div"
                        );

                    header.className =
                        "guestbook-entry-header";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "guestbook-entry-name";

                    name.textContent =
                        entry.name;


                    const right =
                        document.createElement(
                            "div"
                        );

                    right.className =
                        "guestbook-entry-right";


                    const date =
                        document.createElement(
                            "div"
                        );

                    date.className =
                        "guestbook-entry-date";

                    date.textContent =
                        entry.date;


                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.type =
                        "button";

                    deleteButton.className =
                        "guestbook-delete-button";

                    deleteButton.dataset.index =
                        index;

                    deleteButton.textContent =
                        "×";


                    right.appendChild(
                        date
                    );

                    right.appendChild(
                        deleteButton
                    );


                    header.appendChild(
                        name
                    );

                    header.appendChild(
                        right
                    );


                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "guestbook-entry-content";

                    content.textContent =
                        entry.content;


                    entryElement.appendChild(
                        header
                    );

                    entryElement.appendChild(
                        content
                    );


                    guestbookEntryList.appendChild(
                        entryElement
                    );

                }
            );

        }

                    guestbookPassword.value.trim();


                if (!name) {

                    alert(
                        "이름을 입력해 주세요."
                    );

                    guestbookName.focus();

                    return;

                }


                if (!content) {

                    alert(
                        "내용을 작성해 주세요."
                    );

                    guestbookContent.focus();

                    return;

                }


                if (!password) {

                    alert(
                        "비밀번호를 입력해 주세요."
                    );

                    guestbookPassword.focus();

                    return;

                }


                const entries =
                    getGuestbookEntries();


                const today =
                    new Date();


                const date =
                    today.getFullYear() +
                    "." +
                    String(
                        today.getMonth() + 1
                    ).padStart(2, "0") +
                    "." +
                    String(
                        today.getDate()
                    ).padStart(2, "0");


                entries.push({

                    name:
                        name,

                    content:
                        content,

                    password:
                        password,

                    date:
                        date

                });


                localStorage.setItem(
                    "weddingGuestbook",
                    JSON.stringify(entries)
                );


                guestbookName.value =
                    "";

                guestbookContent.value =
                    "";

                guestbookPassword.value =
                    "";


                closeGuestbookForm();

                updateGuestbookScreen();

            }
        );


        guestbookEntryList.addEventListener(
            "click",
            (event) => {

                const deleteButton =
                    event.target.closest(
                        ".guestbook-delete-button"
                    );


                if (!deleteButton) {
                    return;
                }


                const index =
                    Number(
                        deleteButton.dataset.index
                    );


                const entries =
                    getGuestbookEntries();


                const entry =
                    entries[index];


                if (!entry) {
                    return;
                }


                const password =
                    prompt(
                        "방명록 작성 시 입력한 비밀번호를 입력해주세요."
                    );


                if (
                    password === null
                ) {
                    return;
                }


                if (
                    password !==
                    entry.password
                ) {

                    alert(
                        "비밀번호가 일치하지 않습니다."
                    );

                    return;

                }


                entries.splice(
                    index,
                    1
                );


                localStorage.setItem(
                    "weddingGuestbook",
                    JSON.stringify(entries)
                );


                updateGuestbookScreen();

            }
        );


        updateGuestbookScreen();


        /* ==================================================
           계좌번호 아코디언
        ================================================== */

        const accountBoxes =
            document.querySelectorAll(
                ".account-box"
            );


        accountBoxes.forEach(
            (box) => {

                const button =
                    box.querySelector(
                        ".account-button"
                    );

                const closeButton =
                    box.querySelector(
                        ".account-close-button"
                    );


                button.addEventListener(
                    "click",
                    () => {

                        box.classList.add(
                            "open"
                        );

                    }
                );


                closeButton.addEventListener(
                    "click",
                    (event) => {

                        event.stopPropagation();

                        box.classList.remove(
                            "open"
                        );


                        const accountInfoImage =
                            box.querySelector(
                                ".account-info img"
                            );


                        if (
                            accountInfoImage
                        ) {

                            accountInfoImage.classList.remove(
                                "show"
                            );

                        }

                    }
                );

            }
        );


        /* ==================================================
           계좌번호 복사
        ================================================== */

        const accountCopyButtons =
            document.querySelectorAll(
                ".account-copy-button"
            );

        const copyPopup =
            document.getElementById(
                "copy-popup"
            );

        const copyConfirmButton =
            document.getElementById(
                "copy-confirm-button"
            );


        let selectedAccountNumber =
            "";


        accountCopyButtons.forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    (event) => {

                        event.stopPropagation();

                        selectedAccountNumber =
                            button.dataset.account;

                        copyPopup.classList.add(
                            "show"
                        );

                    }
                );

            }
        );


        copyConfirmButton.addEventListener(
            "click",
            async () => {

                if (
                    !selectedAccountNumber
                ) {
                    return;
                }


                try {

                    await navigator.clipboard.writeText(
                        selectedAccountNumber
                    );

                } catch (error) {

                    const textarea =
                        document.createElement(
                            "textarea"
                        );


                    textarea.value =
                        selectedAccountNumber;

                    textarea.style.position =
                        "fixed";

                    textarea.style.left =
                        "-9999px";


                    document.body.appendChild(
                        textarea
                    );


                    textarea.select();


                    document.execCommand(
                        "copy"
                    );


                    document.body.removeChild(
                        textarea
                    );

                }


                selectedAccountNumber =
                    "";

                copyPopup.classList.remove(
                    "show"
                );

            }
        );


        copyPopup.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    copyPopup
                ) {

                    copyPopup.classList.remove(
                        "show"
                    );

                    selectedAccountNumber =
                        "";

                }

            }
        );
        /* =====================================
           계좌번호 신랑 / 신부 버튼 전용 Observer
        ===================================== */

        const accountButtonRevealObserver =
            new IntersectionObserver(
                (entries) => {

                    entries.forEach(
                        (entry) => {

                            const image =
                                entry.target.querySelector(
                                    ".account-button-image"
                                );

                            if (!image) {
                                return;
                            }

                            if (
                                entry.isIntersecting
                            ) {

                                image.classList.add(
                                    "show"
                                );

                            } else {

                                image.classList.remove(
                                    "show"
                                );

                            }

                        }
                    );

                },
                {
                    threshold: 0.05,

                    rootMargin:
                        "0px 0px -30px 0px"
                }
            );


        document
            .querySelectorAll(".account-button")
            .forEach(
                (button) => {

                    accountButtonRevealObserver.observe(
                        button
                    );

                }
            );

        /* ==================================================
           연락하기 팝업
        ================================================== */

        const contactOpenButton =
            document.getElementById(
                "contact-open-button"
            );

        const contactPopup =
            document.getElementById(
                "contact-popup"
            );

        const contactPopupClose =
            document.getElementById(
                "contact-popup-close"
            );


        contactOpenButton.addEventListener(
            "click",
            () => {

                contactPopup.classList.add(
                    "show"
                );

                document.body.style.overflow =
                    "hidden";

            }
        );


        contactPopupClose.addEventListener(
            "click",
            () => {

                contactPopup.classList.remove(
                    "show"
                );

                document.body.style.overflow =
                    "";

            }
        );


        contactPopup.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    contactPopup
                ) {

                    contactPopup.classList.remove(
                        "show"
                    );

                    document.body.style.overflow =
                        "";

                }

            }
        );
/* ==================================================
   공유하기
================================================== */

const shareButton = document.getElementById("shareButton");
const shareMenu = document.getElementById("shareMenu");
const shareCopyButton = document.getElementById("shareCopyButton");
const shareKakaoButton = document.getElementById("shareKakaoButton");
const shareMoreButton = document.getElementById("shareMoreButton");
const shareSmsButton = document.getElementById("shareSmsButton");


/* -------------------------------------
   공유 메뉴 열기 / 닫기
------------------------------------- */

shareButton.addEventListener("click", () => {
    shareMenu.classList.toggle("open");
});


/* -------------------------------------
   링크 복사
------------------------------------- */

shareCopyButton.addEventListener("click", async () => {

    const currentUrl = window.location.href;

    try {

        await navigator.clipboard.writeText(currentUrl);

        alert("청첩장 링크가 복사되었습니다.");

    } catch (error) {

        const textArea = document.createElement("textarea");

        textArea.value = currentUrl;
        document.body.appendChild(textArea);

        textArea.select();
        document.execCommand("copy");

        document.body.removeChild(textArea);

        alert("청첩장 링크가 복사되었습니다.");
    }

});


/* -------------------------------------
   카카오톡 공유
------------------------------------- */

shareKakaoButton.addEventListener("click", () => {
    Kakao.Share.sendDefault({
        objectType: "feed",
        content: {
            title: "우리의 결혼식",
            description: "저희 결혼식에 초대합니다.",
            imageUrl: window.location.origin + "/images/main/main.png",
            link: {
                mobileWebUrl: window.location.href,
                webUrl: window.location.href
            }
        },
        buttons: [
            {
                title: "청첩장 보러가기",
                link: {
                    mobileWebUrl: window.location.href,
                    webUrl: window.location.href
                }
            }
        ]
    });
});


/* -------------------------------------
   더보기
------------------------------------- */

shareMoreButton.addEventListener("click", async () => {

    const currentUrl = window.location.href;

    if (navigator.share) {

        try {

            await navigator.share({
                title: "우리의 결혼식",
                text: "저희 결혼식에 초대합니다.",
                url: currentUrl
            });

        } catch (error) {

            console.log("공유가 취소되었습니다.");

        }

    } else {

        alert("이 기기에서는 기본 공유 기능을 사용할 수 없습니다.");

    }

});


/* -------------------------------------
   문자 보내기
------------------------------------- */

shareSmsButton.addEventListener("click", () => {

    const currentUrl = window.location.href;

    const message =
        "저희 결혼식에 초대합니다.%0A%0A" +
        currentUrl;

    window.location.href = "sms:?body=" + message;

});
    </script>
